<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mayank Kulkarni | AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .chat-wrapper {
      width: 100%;
      max-width: 900px;
      height: 85vh;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 1;
    }
    /* Ensures the Zapier iframe takes full space and receives clicks */
    zapier-interfaces-chatbot-embed {
      width: 100% !important;
      height: 100% !important;
      display: block;
      pointer-events: auto !important;
    }
  </style>
</head>
<body>

  <div class="chat-wrapper">
    <script async type='module' src='https://interfaces.zapier.com/assets/web-components/zapier-interfaces/zapier-interfaces.esm.js'></script>
<zapier-interfaces-chatbot-embed is-popup='false' chatbot-id='cmtvp36gg006912jxzjjav8bu' height='600px' width='400px'></zapier-interfaces-chatbot-embed>
  </div>

</body>
</html>
